<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChatGPT 表格复制助手</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/icon48.png" width="38" height="38" alt=""><div><h1>ChatGPT 表格复制助手</h1><p>一键复制，粘贴到 Word</p></div></header>
  <main>
    <ol>
      <li><span>1</span><div>打开 ChatGPT 对话<small>安装后，先刷新已打开的页面。</small></div></li>
      <li><span>2</span><div>点击表格右上方的“复制表格”<small>看到“已复制”，就可以粘贴了。</small></div></li>
      <li><span>3</span><div>在 Word 中按 Ctrl + V<small>在粘贴选项中选择“保留源格式”。</small></div></li>
    </ol>
    <p class="hint">保留行列、表头、粗体和链接。<br>粘贴后仍可在 Word 中继续编辑。</p>
